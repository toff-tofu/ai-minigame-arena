<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stacking Arena</title>
  <link rel="stylesheet" href="/ui/style.css">
  <script type="module" src="/ui/viewer.ts"></script>
</head>
<body>
  <main>
    <header>
      <h1>Stacking Arena</h1>
      <form id="match">
        <label>Seed <input id="seed" type="number" min="0" max="4294967295" value="42" required></label>
        <button>New match</button>
      </form>
    </header>
    <section id="online" aria-labelledby="online-title">
      <h2 id="online-title">Invite-code battle</h2>
      <button id="create-battle" type="button">Create battle</button>
      <form id="join-battle">
        <label>Invite code <input id="battle-code" type="text" required maxlength="12" pattern="[A-Fa-f0-9]{12}" autocomplete="off"></label>
        <button>Join battle</button>
      </form>
      <p id="battle-note" role="status"></p>
    </section>
    <div id="boards">
      <section>
        <h2><span id="name-0">Your bot</span> <output id="score-0">0</output></h2>
        <canvas id="board-0" width="288" height="640" aria-label="Your bot board"></canvas>
        <p id="bust-0"></p>
      </section>
      <section>
        <h2><span id="name-1">Stability bot</span> <output id="score-1">0</output></h2>
        <canvas id="board-1" width="288" height="640" aria-label="Stability bot board"></canvas>
        <p id="bust-1"></p>
      </section>
    </div>
    <p id="status" role="status"></p>
    <div id="controls">
      <button id="play">Play</button>
      <button id="back">Back</button>
      <button id="step">Step</button>
      <label>Turn <input id="timeline" type="range" min="0" max="0" value="0"></label>
      <output id="turn">0 / 0</output>
    </div>
    <section id="coaching" aria-labelledby="coaching-title">
      <h2 id="coaching-title">Coach your bot</h2>
      <p id="coach-hint">Pause and rewind to just before one of your bot’s completed turns.</p>
      <div id="coach-controls" hidden>
        <label>Column <input id="coach-column" type="number" min="1" max="9" value="1"></label>
        <label>Rotation <select id="coach-rotation">
          <option value="0">0°</option><option value="1">90°</option>
          <option value="2">180°</option><option value="3">270°</option>
        </select></label>
        <button id="teach">Teach move</button>
      </div>
      <p id="coach-preview"></p>
      <p id="coach-feedback" role="status"></p>
    </section>
  </main>
</body>
</html>
